<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudeep Mannava | Motion Designer</title>
<link rel="icon" href="favicon-dark.png" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon-light.png" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hero/hero.css">
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "framer-motion": "https://esm.sh/framer-motion@11.11.17?external=react,react-dom",
    "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
    "htm": "https://esm.sh/htm@3.1.1"
  }
}
</script>
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div id="root"></div>
<script>
// background grid follows the cursor (one style write per frame at most)
(() => {
  const g = document.querySelector('.bg-grid'); let x = -999, y = -999, queued = false;
  addEventListener('pointermove', e => {
    x = e.clientX; y = e.clientY;
    if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; g.style.setProperty('--mx', x + 'px'); g.style.setProperty('--my', y + 'px'); }); }
  }, { passive: true });
})();
</script>
<script type="module" src="hero/app.js"></script>
</body>
</html>
